name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    # swift-tools-version 6.0 需要 Xcode 16 及以上，macos-15 镜像默认满足。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/httpcompat/go.mod
          cache-dependency-path: tools/httpcompat/go.mod
      - name: 校验固定依赖
        run: |
          python3 scripts/fetch-core.py
          python3 scripts/verify-yams.py
      - name: HTTP 兼容层测试
        working-directory: tools/httpcompat
        run: go test -race ./...
      - name: 构建全部产物
        run: scripts/swift-local.sh build
      - name: 行为检查
        run: |
          .build/debug/QingzhouChecks | tee checks.log
          grep -q 'failures=0' checks.log
      - name: 检查脚本语法
        run: for f in scripts/*.sh; do bash -n "$f"; done
