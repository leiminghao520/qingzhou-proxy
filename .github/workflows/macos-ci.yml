name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    # swift-tools-version 6.0 需要 Xcode 16 及以上，macos-15 镜像默认满足。
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tools/httpcompat/go.mod
      - name: 校验固定依赖
        run: |
          python3 scripts/fetch-core.py
          python3 scripts/verify-pow.py
          python3 scripts/verify-domestic.py
      - name: HTTP 兼容层测试
        working-directory: tools/httpcompat
        run: go test -race ./...
      - name: 构建全部产物
        run: scripts/swift-local.sh build
      - name: 行为检查
        run: |
          # 检查程序按 Bundle.main 查找兼容组件，命令行运行时即可执行文件所在目录。
          mkdir -p .build/debug/Contents/Resources
          (cd tools/httpcompat && go build -trimpath -o ../../.build/debug/Contents/Resources/qzhttp .)
          .build/debug/QingzhouChecks | tee checks.log
          ! grep -E 'failures=[1-9]' checks.log
          grep -qE '^RESULT scenarios=.*failures=0' checks.log
      - name: 检查脚本语法
        run: for f in scripts/*.sh; do bash -n "$f"; done
