log_format hy2_safe '$remote_addr [$time_local] $host $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=hy2_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name proxy.lmh1103.icu admin.lmh1103.icu sub.lmh1103.icu;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lmh1103.icu;
    ssl_certificate /etc/letsencrypt/live/proxy.lmh1103.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.lmh1103.icu/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    access_log /var/log/nginx/hy2-admin-access.log hy2_safe;
    # 联动入口独立限时、限制请求体，不增加后台写操作权限。
    location /api/client/v1/ {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 10s;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /login { limit_req zone=hy2_login burst=10 nodelay; proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header X-Forwarded-Proto https; }
    location / { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header X-Forwarded-Proto https; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sub.lmh1103.icu;
    ssl_certificate /etc/letsencrypt/live/proxy.lmh1103.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.lmh1103.icu/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/hy2-sub-access.log hy2_safe;
    # 联动入口独立限时、限制请求体，不增加后台写操作权限。
    location /api/client/v1/ {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 10s;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /s/ { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header X-Forwarded-Proto https; }
    location / { return 404; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name proxy.lmh1103.icu;
    ssl_certificate /etc/letsencrypt/live/proxy.lmh1103.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.lmh1103.icu/privkey.pem;
    return 404;
}
