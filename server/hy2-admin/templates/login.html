{% extends 'base.html' %}{% from '_macros.html' import csrf with context %}
{% block content %}<div class="login-layout"><div class="login-intro"><p class="eyebrow">HY2 CONSOLE</p><h1>你的连接。<br>尽在掌握。</h1><p>管理每一台设备，清晰了解每一次连接。</p><div class="login-art" aria-hidden="true"><span class="orbit"></span><span class="orbit second"></span><span class="network-core">H2</span><span class="network-node n1">▣</span><span class="network-node n2">◎</span><span class="network-node n3">◇</span></div></div>
<section class="login-card"><h2>登录管理后台</h2><p class="muted">使用后台账号及验证器动态码登录。</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="stack">{{ csrf() }}<input type="hidden" name="next" value="{{ next or '/' }}"><label>管理员账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><label>6 位动态码<input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required><small>打开绑定的验证器 App 获取</small></label><button>安全登录 →</button></form><p class="login-note">这里使用后台管理员身份，<br>代理设备凭据不能用于登录。</p></section></div>{% endblock %}
