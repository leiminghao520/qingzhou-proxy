{% extends 'base.html' %}{% from '_macros.html' import csrf with context %}
{% block location %}安全设置{% endblock %}
{% block content %}<header class="page-header"><div><p class="eyebrow">后台身份</p><h1>安全设置</h1><p class="muted">修改后台登录密码，不影响设备的代理凭据。</p></div></header><section class="panel narrow"><h2>更新密码</h2>{% if must_change %}<p class="notice warning">首次登录请先更新密码。</p>{% endif %}{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form class="stack" method="post">{{ csrf() }}<label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label><label>6 位动态码<input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>新密码<input name="new_password" type="password" minlength="14" autocomplete="new-password" required><small>至少 14 位</small></label><button>更新密码</button></form></section>{% endblock %}
